name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支连续推送时取消尚未完成的旧运行，避免排队堆积。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend (version + typecheck + test + build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 三处配置（package.json / tauri.conf.json / Cargo.toml）的版本号必须一致，
      # 否则发版时会打出名字对不上的安装包。
      - name: Check version consistency
        run: npm run check:version

      # 前端单测走 Node 22 内置的 `node --test --experimental-strip-types`，
      # 不需要 vitest / jest 这类测试框架；test:types 单独用 tsconfig.test.json
      # 检查测试文件的类型（测试 import 带 .ts 后缀，与应用构建的配置不同）。
      - name: Frontend tests
        run: npm test

      - name: Frontend lint
        run: npm run lint

      - name: Type check and build
        run: npm run build

  rust:
    name: rust (fmt + check + clippy + test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # 用量口径（model_slot / token_breakdown / merge_model_slot）与配置读写
      # 的回归防线。这两块是历次口径调整最容易出问题的地方。
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
